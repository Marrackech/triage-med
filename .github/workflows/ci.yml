name: CI/CD - Agent de triage médical

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements.txt
          pip install pytest

      - name: Tests Pytest
        env:
          TRIAGE_API_KEY: test-secret-key
          MODEL_NAME: test-model
        run: |
          cd deployment
          python -m pytest -q tests

      - name: Construction de l'image Docker
        run: |
          docker build \
            -f deployment/dockerfile \
            -t chsa-triage-agent:test \
            deployment

      - name: Lancement du conteneur pour test
        run: |
          docker run -d \
            -p 8080:8080 \
            -e TRIAGE_API_KEY=test-secret-key \
            -e MODEL_NAME=test-model \
            --name chsa-test \
            chsa-triage-agent:test

          sleep 10

      - name: Test du endpoint /health
        run: |
          curl --fail http://localhost:8080/health
          echo "✅ Le endpoint /health répond correctement"

      - name: Nettoyage
        if: always()
        run: |
          docker stop chsa-test || true
          docker rm chsa-test || true

      - name: Connexion à GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Publication de l'image Docker
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/chsa-triage-agent"

          docker tag chsa-triage-agent:test "${IMAGE_NAME}:latest"
          docker tag chsa-triage-agent:test "${IMAGE_NAME}:${{ github.sha }}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
