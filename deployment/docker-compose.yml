services:

  vllm:
    image: vllm/vllm-openai:latest
    container_name: chsa-vllm
    environment:
      HF_TOKEN: ${HF_TOKEN}
    command:
      - "--model"
      - "${MODEL_NAME}"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "2048"
      - "--gpu-memory-utilization"
      - "0.85"
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: dockerfile
    container_name: chsa-fastapi
    environment:
      MODEL_NAME: ${MODEL_NAME}
      VLLM_URL: http://vllm:8000/v1/completions
      LOG_FILE: /app/traceability_log.jsonl
      TRIAGE_API_KEY: ${TRIAGE_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - vllm
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  hf-cache:
